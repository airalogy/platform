[project]
name = "airalogy-instrument-gateway"
version = "0.1.0"
description = "Pull-only local runtime for governed Airalogy Instrument Jobs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Airalogy" }]
dependencies = []

[project.scripts]
airalogy-instrument-gateway = "airalogy_instrument_gateway.__main__:main"

[project.entry-points."airalogy.instrument_adapters"]
mock = "airalogy_instrument_gateway.adapters:mock_adapter_factory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.uv-cache", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/airalogy_instrument_gateway"]
