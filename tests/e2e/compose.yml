name: airalogy-platform-e2e

services:
  db:
    build:
      context: ../../apps/api
      dockerfile: postgresql.Dockerfile
    environment:
      POSTGRES_USER: airalogy_e2e
      POSTGRES_PASSWORD: airalogy_e2e
      POSTGRES_DB: airalogy_e2e
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airalogy_e2e -d airalogy_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: airalogy-platform-object-storage:e2e
    build:
      context: ../../deploy/object-storage
    command: server /data --address ":9200" --console-address ":9201"
    environment:
      MINIO_ROOT_USER: airalogy_e2e
      MINIO_ROOT_PASSWORD: airalogy-e2e-password
    ports:
      - "127.0.0.1:59200:9200"
      - "127.0.0.1:59201:9201"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9200 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready local"]
      interval: 3s
      timeout: 10s
      retries: 30

  createbuckets:
    image: airalogy-platform-object-storage:e2e
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: airalogy_e2e
      MINIO_ROOT_PASSWORD: airalogy-e2e-password
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9200 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/airalogy-e2e

volumes:
  postgres-data:
  minio-data:
