name: Browser E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "tests/e2e/**"
      - "scripts/e2e-runner.test.mjs"
      - "scripts/e2e-matrix.mjs"
      - "scripts/check-image-availability*"
      - "scripts/*object-storage*"
      - "deploy/object-storage/**"
      - "scripts/pre-push*.mjs"
      - "playwright.config.ts"
      - "package.json"
      - ".node-version"
      - "scripts/check-node-runtime*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "tests/e2e/**"
      - "scripts/e2e-runner.test.mjs"
      - "scripts/e2e-matrix.mjs"
      - "scripts/check-image-availability*"
      - "scripts/*object-storage*"
      - "deploy/object-storage/**"
      - "scripts/pre-push*.mjs"
      - "playwright.config.ts"
      - "package.json"
      - ".node-version"
      - "scripts/check-node-runtime*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - name: Check cold registry access before installing dependencies
        run: node scripts/check-image-availability.mjs
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: storage
        run: echo "fingerprint=$(node scripts/prepare-object-storage.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Build source-verified storage once for all isolated shards
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/object-storage
          load: true
          tags: airalogy-platform-object-storage:e2e
          labels: io.airalogy.object-storage.inputs=${{ steps.storage.outputs.fingerprint }}
          cache-from: type=gha,scope=platform-object-storage-test
          cache-to: type=gha,mode=max,scope=platform-object-storage-test
      - name: Verify storage behavior and fresh-server recovery
        run: node scripts/object-storage-acceptance.mjs
      - run: docker save airalogy-platform-object-storage:e2e -o "$RUNNER_TEMP/object-storage.tar"
      - uses: actions/upload-artifact@v6
        with:
          name: object-storage-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/object-storage.tar
          compression-level: 0
          retention-days: 7

  chromium:
    needs: preflight
    name: chromium-${{ matrix.mode }}-${{ matrix.shard }}-of-${{ matrix.total }}
    runs-on: ubuntu-latest
    # Each matrix job owns an entire disposable runner, DB, storage and accounts.
    # Keep workers=1 within each shard; no shared-state tests run concurrently.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: enabled, shard: 1, total: 4 }
          - { mode: enabled, shard: 2, total: 4 }
          - { mode: enabled, shard: 3, total: 4 }
          - { mode: enabled, shard: 4, total: 4 }
          - { mode: disabled, shard: 1, total: 1 }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: object-storage-${{ github.run_id }}
          path: ${{ runner.temp }}/object-storage
      - name: Load and verify this checkout's storage image
        run: |
          docker load -i "$RUNNER_TEMP/object-storage/object-storage.tar"
          node scripts/prepare-object-storage.mjs --verify

      - name: Cache pnpm downloads
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.local/share/pnpm/store

      - name: Install API dependencies
        run: uv --directory apps/api sync --locked

      - name: Verify local check selection and E2E argument forwarding
        run: pnpm prepush:test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          BROWSER_MODE: ${{ matrix.mode }}
          BROWSER_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: node scripts/e2e-matrix.mjs --mode "$BROWSER_MODE" --shard "$BROWSER_SHARD"

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            tests/e2e/.runtime/api.log

  browser-gate:
    if: always()
    needs: [preflight, chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mode and shard to pass
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BROWSER_RESULT: ${{ needs.chromium.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$BROWSER_RESULT" = success
