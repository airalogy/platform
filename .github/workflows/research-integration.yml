name: Research Integration

on:
  pull_request:
    paths:
      [
        "apps/api/**",
        "apps/compute-runner/src/**",
        "apps/compute-runner/tests/**",
        "apps/instrument-gateway/src/**",
        "apps/instrument-gateway/tests/**",
        "apps/instrument-gateway/examples/**",
        "apps/instrument-interface/**",
        "scripts/instrument-interface-example.mjs",
        "scripts/instrument-interface-worker-example.mjs",
        "scripts/prepare-instrument-ci*",
        "scripts/compute-runner-integration.mjs",
        "scripts/research-integration.mjs",
        "scripts/check-image-availability*",
        "scripts/*object-storage*",
        "deploy/object-storage/**",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tests/e2e/**",
        "package.json",
        ".node-version",
        "scripts/check-node-runtime*",
        ".github/workflows/research-integration.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/api/**",
        "apps/compute-runner/src/**",
        "apps/compute-runner/tests/**",
        "apps/instrument-gateway/src/**",
        "apps/instrument-gateway/tests/**",
        "apps/instrument-gateway/examples/**",
        "apps/instrument-interface/**",
        "scripts/instrument-interface-example.mjs",
        "scripts/instrument-interface-worker-example.mjs",
        "scripts/prepare-instrument-ci*",
        "scripts/compute-runner-integration.mjs",
        "scripts/research-integration.mjs",
        "scripts/check-image-availability*",
        "scripts/*object-storage*",
        "deploy/object-storage/**",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tests/e2e/**",
        "package.json",
        ".node-version",
        "scripts/check-node-runtime*",
        ".github/workflows/research-integration.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - name: Check cold registry access before installing dependencies
        run: node scripts/check-image-availability.mjs
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: storage
        run: echo "fingerprint=$(node scripts/prepare-object-storage.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/object-storage
          load: true
          tags: airalogy-platform-object-storage:e2e
          labels: io.airalogy.object-storage.inputs=${{ steps.storage.outputs.fingerprint }}
          cache-from: type=gha,scope=platform-object-storage-research
          cache-to: type=gha,mode=max,scope=platform-object-storage-research
      - name: Cache pnpm downloads
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-research-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}
      - name: Install locked browser interface runtime
        run: |
          corepack enable
          pnpm install --frozen-lockfile --store-dir ~/.local/share/pnpm/store
          pnpm exec playwright install --with-deps chromium
          pnpm gateway:contract:check
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked API dependencies
        run: uv --directory apps/api sync --locked
      - name: Prepare trusted CI executables and sandboxed Chromium
        run: node scripts/prepare-instrument-ci.mjs --executables --browser
      - name: Migrate isolated database and run real API/worker acceptance
        run: pnpm research:integration -q --tb=short
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: research-integration-diagnostics
          path: tests/e2e/.runtime/api.log
          retention-days: 7
