name: Compute Runner

on:
  push:
    paths:
      - "apps/compute-runner/**"
      - "scripts/compute-runner-integration.mjs"
      - "apps/api/app/routers/analysis_compute.py"
      - "apps/api/app/routers/research_compute_jobs.py"
      - "apps/api/app/services/analysis_compute*.py"
      - "apps/api/app/services/research_compute_jobs.py"
      - ".github/workflows/compute-runner.yml"
  pull_request:
    paths:
      - "apps/compute-runner/**"
      - "scripts/compute-runner-integration.mjs"
      - "apps/api/app/routers/analysis_compute.py"
      - "apps/api/app/routers/research_compute_jobs.py"
      - "apps/api/app/services/analysis_compute*.py"
      - "apps/api/app/services/research_compute_jobs.py"
      - ".github/workflows/compute-runner.yml"

concurrency:
  group: compute-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compute-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify lockfile
        run: uv lock --check

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Run real isolated Compute acceptance
        working-directory: .
        run: node scripts/pre-push.mjs --check compute-engine

      - name: Compile package
        run: python -m compileall -q src tests

      - name: Build package
        run: uv build

      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/compute-runner-wheel"
          "$RUNNER_TEMP/compute-runner-wheel/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/compute-runner-wheel/bin/python" -c \
            "import airalogy_compute_runner, importlib.metadata; print(importlib.metadata.version('airalogy-compute-runner'))"
