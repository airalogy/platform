name: Instrument Interface

on:
  push:
    paths:
      - "apps/instrument-interface/**"
      - "apps/instrument-gateway/src/**"
      - "apps/instrument-gateway/tests/native_read*.py"
      - "apps/api/app/services/instrument_survey.schema.json"
      - "apps/api/app/services/instrument_exploration.schema.json"
      - "apps/api/app/services/instrument_application_selection.schema.json"
      - "scripts/sync-instrument-contract.mjs"
      - "apps/instrument-gateway/examples/simulated-reader.html"
      - "scripts/instrument-interface-example.mjs"
      - "scripts/instrument-interface-worker-example.mjs"
      - "scripts/instrument-gui-demo.mjs"
      - "scripts/prepare-instrument-ci*"
      - "scripts/pre-push*"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/instrument-interface.yml"
  pull_request:
    paths:
      - "apps/instrument-interface/**"
      - "apps/instrument-gateway/src/**"
      - "apps/instrument-gateway/tests/native_read*.py"
      - "apps/api/app/services/instrument_survey.schema.json"
      - "apps/api/app/services/instrument_exploration.schema.json"
      - "apps/api/app/services/instrument_application_selection.schema.json"
      - "scripts/sync-instrument-contract.mjs"
      - "apps/instrument-gateway/examples/simulated-reader.html"
      - "scripts/instrument-interface-example.mjs"
      - "scripts/instrument-interface-worker-example.mjs"
      - "scripts/instrument-gui-demo.mjs"
      - "scripts/prepare-instrument-ci*"
      - "scripts/pre-push*"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/instrument-interface.yml"

permissions:
  contents: read

concurrency:
  group: instrument-interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-browser:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify versions, syntax and lint
        run: |
          node scripts/pre-push.mjs --check version
          node scripts/pre-push.mjs --check instrument-contract
          pnpm --filter @airalogy/instrument-interface lint
          node --check apps/instrument-interface/src/cli.mjs
      - name: Prepare trusted CI executables and sandboxed Chromium
        run: |
          node --test scripts/prepare-instrument-ci.test.mjs
          node scripts/prepare-instrument-ci.mjs --executables --browser
      - name: Test bounded browser sessions and CLI
        run: node scripts/pre-push.mjs --check interface-tests
      - name: Compile native read transport and owned simulator without opening applications
        if: runner.os == 'macOS'
        run: node scripts/pre-push.mjs --check native-build-tests
      # Actual AX tests require an operator-authorized graphical macOS session.
      # Never grant TCC or silently turn a missing permission into a passing GUI test.
      - name: Verify existing rehearsal compatibility
        run: node scripts/pre-push.mjs --check interface-demo
      - name: Build installable package
        run: pnpm --filter @airalogy/instrument-interface pack --pack-destination "$RUNNER_TEMP"
      # Local evidence is intentionally not uploaded; CI fixtures are synthetic too.
