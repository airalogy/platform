name: Instrument Gateway

on:
  push:
    paths:
      - "apps/instrument-gateway/**"
      - "apps/api/app/services/instrument_adapter_contract.py"
      - "apps/api/app/services/instrument_package_contract.py"
      - "apps/api/app/services/instrument_installation_contract.py"
      - "apps/api/app/services/instrument_activation_contract.py"
      - "apps/api/app/services/instrument_output_contract.py"
      - "apps/api/app/services/instrument_authoring_contract.py"
      - "scripts/sync-instrument-contract.mjs"
      - "scripts/instrument-authoring-example.mjs"
      - "scripts/prepare-instrument-ci*"
      - "scripts/pre-push*"
      - ".github/workflows/instrument-gateway.yml"
  pull_request:
    paths:
      - "apps/instrument-gateway/**"
      - "apps/api/app/services/instrument_adapter_contract.py"
      - "apps/api/app/services/instrument_package_contract.py"
      - "apps/api/app/services/instrument_installation_contract.py"
      - "apps/api/app/services/instrument_activation_contract.py"
      - "apps/api/app/services/instrument_output_contract.py"
      - "apps/api/app/services/instrument_authoring_contract.py"
      - "scripts/sync-instrument-contract.mjs"
      - "scripts/instrument-authoring-example.mjs"
      - "scripts/prepare-instrument-ci*"
      - "scripts/pre-push*"
      - ".github/workflows/instrument-gateway.yml"

concurrency:
  group: instrument-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/instrument-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify lockfile
        run: uv lock --check

      - name: Prepare trusted CI executables
        working-directory: .
        run: |
          node --test scripts/prepare-instrument-ci.test.mjs
          node scripts/prepare-instrument-ci.mjs --executables

      - name: Run tests
        working-directory: .
        run: |
          node scripts/pre-push.mjs --check gateway-cli
          node scripts/pre-push.mjs --check gateway-tests

      - name: Compile package
        run: python -m compileall -q src tests bootstrap.py

      - name: Build package
        run: uv build

      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/instrument-gateway-wheel"
          "$RUNNER_TEMP/instrument-gateway-wheel/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/instrument-gateway-wheel/bin/python" -c \
            "import airalogy_instrument_gateway, importlib.metadata; print(importlib.metadata.version('airalogy-instrument-gateway'))"
          "$RUNNER_TEMP/instrument-gateway-wheel/bin/python" tests/check_installed_setup.py

      - name: Verify isolated SDK bootstrap and local guides
        run: >-
          python tests/check_bootstrap_install.py --wheel "dist/airalogy_instrument_gateway-$(cat ../../VERSION)-py3-none-any.whl" --release-tag "v$(cat ../../VERSION)"

      - name: Exercise adapter package isolation and timeout
        env:
          ADAPTER_TEST_IMAGE: python@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
        run: |
          docker pull "$ADAPTER_TEST_IMAGE"
          export ADAPTER_TEST_SDK_WHEEL="$(pwd)/dist/airalogy_instrument_gateway-$(cat ../../VERSION)-py3-none-any.whl"
          RUN_ADAPTER_SANDBOX_TESTS=1 PYTHONPATH=src python -m unittest discover -s tests -p 'test_package*.py' -v
