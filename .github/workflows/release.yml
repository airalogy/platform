name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/airalogy
      SECRET_KEY: release-verification-secret
      AES_KEY: "1234567890123456789012345678901234567890123456789012345678901234"
      AIRALOGY_ENDPOINT: http://localhost:4000
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: minio:9200
      MINIO_BUCKET: airalogy
      MINIO_ACCESS_KEY: airalogy
      MINIO_SECRET_KEY: airalogy-minio-password
      MINIO_PROXY_PATH: /minio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:tools:install
      - run: node scripts/pre-push.mjs --check ci-config
      - run: node scripts/prepare-instrument-ci.mjs --executables
      - run: node scripts/pre-push.mjs --check gateway-cli
      - run: uv --directory apps/api sync --locked --dev
      - run: uv --directory apps/compute-runner lock --check
      - run: uv --directory apps/instrument-gateway lock --check
      - run: pnpm version:check
      - run: pnpm release:metadata:test
      - run: pnpm deployment:identity:test
      - run: uv --directory apps/api run --with pytest python -m pytest tests
      - run: pnpm compute-runner:test
      - run: pnpm gateway:test
      - run: node scripts/pre-push.mjs --check gateway-sandbox
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
      - run: bash -n deploy/single-lab/platformctl deploy/single-lab/scripts/*.sh
      - run: pnpm release:check -- "$RELEASE_TAG"

  gateway-package:
    needs: verify
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
      - run: node scripts/prepare-instrument-ci.mjs --executables
      - run: uv --directory apps/instrument-gateway lock --check
      - run: uv --directory apps/instrument-gateway build
      - name: Include independently verifiable SDK bootstrap
        run: cp apps/instrument-gateway/bootstrap.py apps/instrument-gateway/dist/airalogy-instrument-bootstrap.py
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        id: gateway_provenance
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: apps/instrument-gateway/dist/*
      - name: Retain SDK attestation bundle for offline verification
        if: github.event.repository.visibility == 'public'
        env:
          SDK_ATTESTATION_BUNDLE: ${{ steps.gateway_provenance.outputs.bundle-path }}
        run: cp "$SDK_ATTESTATION_BUNDLE" apps/instrument-gateway/dist/airalogy-instrument-attestations.jsonl
      - name: Verify official SDK provenance and isolated installation
        if: github.repository == 'airalogy/platform' && github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python apps/instrument-gateway/tests/check_bootstrap_install.py --wheel "apps/instrument-gateway/dist/airalogy_instrument_gateway-$(cat VERSION)-py3-none-any.whl" --release-tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --verify-release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-instrument-gateway-package
          path: apps/instrument-gateway/dist/*
          if-no-files-found: error

  compute-runner-package:
    needs: verify
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv --directory apps/compute-runner lock --check
      - run: uv --directory apps/compute-runner build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: apps/compute-runner/dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-compute-runner-package
          path: apps/compute-runner/dist/*
          if-no-files-found: error

  images:
    needs: verify
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            context: .
            dockerfile: ./deploy/single-lab/web.Dockerfile
          - component: protocol-executor
            context: ./apps/api
            dockerfile: ./apps/api/protocol_executor.Dockerfile
          - component: postgres
            context: ./apps/api
            dockerfile: ./apps/api/postgresql.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        name: Resolve reproducible source timestamp
        run: git show -s --format='build-time=%cI' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PLATFORM_VERSION=${{ steps.metadata.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
            BUILD_TIME=${{ steps.source.outputs.build-time }}
            BUILD_DIRTY=false
          cache-from: type=gha,scope=platform-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=platform-${{ matrix.component }}
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image identity
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-metadata
          printf '%s\n' "$IMAGE_REPOSITORY" > "image-metadata/$COMPONENT.repository"
          printf '%s\n' "$IMAGE_DIGEST" > "image-metadata/$COMPONENT.digest"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-${{ matrix.component }}-image-metadata
          path: image-metadata
          if-no-files-found: error

  release:
    needs: [images, gateway-package, compute-runner-package]
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: platform-*-image-metadata
          path: image-metadata
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: platform-instrument-gateway-package
          path: instrument-gateway-package
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: platform-compute-runner-package
          path: compute-runner-package
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Assemble immutable Platform release
        # The migration reader uses Python's standard-library AST only; it does
        # not import or execute migrations while assembling release metadata.
        run: |
          mkdir -p release-stage/deploy release-stage/docs/zh/releases release-stage/docs/en/releases
          cp -R deploy/single-lab release-stage/deploy/single-lab
          cp README.md README.zh-CN.md LICENSE NOTICE TRADEMARKS.md SECURITY.md CHANGELOG.md CHANGELOG.zh-CN.md VERSION release-stage/
          cp docs/zh/single-lab-deployment.md docs/zh/release-and-deployment-identity.md release-stage/docs/zh/
          cp docs/en/single-lab-deployment.md docs/en/release-and-deployment-identity.md release-stage/docs/en/
          cp "docs/zh/releases/${GITHUB_REF_NAME}.md" release-stage/docs/zh/releases/
          cp "docs/en/releases/${GITHUB_REF_NAME}.md" release-stage/docs/en/releases/
          node scripts/create-release-metadata.mjs \
            --metadata-directory image-metadata \
            --output-directory release-stage/deploy/single-lab \
            --env-template deploy/single-lab/.env.example \
            --release-tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA"
      - name: Smoke test the exact released component set
        run: |
          smoke_project=platform-release-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          smoke_env=$RUNNER_TEMP/$smoke_project.env
          deployment_id=dep_$(openssl rand -hex 16)
          secret_key=$(openssl rand -hex 48)
          aes_key=$(openssl rand -hex 32)
          inner_key=$(openssl rand -hex 32)
          setup_code=$(openssl rand -hex 24)
          database_password=$(openssl rand -hex 24)
          minio_password=$(openssl rand -hex 24)
          cp release-stage/deploy/single-lab/.env.example "$smoke_env"
          sed -i \
            -e "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=$smoke_project/" \
            -e "s/^AIRALOGY_DEPLOYMENT_ID=.*/AIRALOGY_DEPLOYMENT_ID=$deployment_id/" \
            -e 's|^SITE_URL=.*|SITE_URL=http://localhost:18080|' \
            -e 's/^HTTP_PORT=.*/HTTP_PORT=18080/' \
            -e "s/^SECRET_KEY=.*/SECRET_KEY=$secret_key/" \
            -e "s/^AES_KEY=.*/AES_KEY=$aes_key/" \
            -e "s/^INNER_API_KEY=.*/INNER_API_KEY=$inner_key/" \
            -e "s/^INITIAL_ADMIN_TOKEN=.*/INITIAL_ADMIN_TOKEN=$setup_code/" \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$database_password/" \
            -e "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=$minio_password/" \
            -e "s|^AIRALOGY_STATE_DIR=.*|AIRALOGY_STATE_DIR=$RUNNER_TEMP/$smoke_project-state|" \
            -e "s|^BACKUP_DIR=.*|BACKUP_DIR=$RUNNER_TEMP/$smoke_project-backups|" \
            "$smoke_env"
          chmod 600 "$smoke_env"
          cleanup() {
            AIRALOGY_ENV_FILE="$smoke_env" docker compose \
              --project-directory release-stage/deploy/single-lab \
              --env-file "$smoke_env" \
              -f release-stage/deploy/single-lab/compose.yml \
              down --volumes --remove-orphans
          }
          trap cleanup EXIT
          AIRALOGY_ENV_FILE="$smoke_env" release-stage/deploy/single-lab/platformctl install
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health/ready
          curl --fail --silent --show-error http://127.0.0.1:18080/api/system/version
          export AIRALOGY_ENV_FILE="$smoke_env"
          release-stage/deploy/single-lab/scripts/acceptance-test.sh
          backup_path="$(release-stage/deploy/single-lab/platformctl backup release-restore)"
          release-stage/deploy/single-lab/platformctl restore "$backup_path" --yes
          # First release: rehearse the upgrade/rollback mechanism, not a claimed
          # cross-version compatibility test against a nonexistent older release.
          release-stage/deploy/single-lab/platformctl upgrade --no-pull
          release-stage/deploy/single-lab/platformctl rollback --yes
          release-stage/deploy/single-lab/platformctl status
          cleanup
          trap - EXIT
      - name: Package deployment files
        run: |
          node scripts/check-release-stage.mjs release-stage
          tar -czf "airalogy-platform-deploy-${GITHUB_REF_NAME}.tar.gz" -C release-stage .
          sha256sum "airalogy-platform-deploy-${GITHUB_REF_NAME}.tar.gz" > "airalogy-platform-deploy-${GITHUB_REF_NAME}.tar.gz.sha256"
          cp release-stage/deploy/single-lab/release-manifest.json "airalogy-platform-release-${GITHUB_REF_NAME}.json"
          cp release-stage/deploy/single-lab/release-manifest.env "airalogy-platform-release-${GITHUB_REF_NAME}.env"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: airalogy-platform-deploy-${{ github.ref_name }}.tar.gz
      - name: Verify public installation access
        # A successful authenticated smoke test alone does not prove that users
        # can install a public release: newly created GHCR packages are private.
        # Keep publication blocked until every exact image is anonymously readable.
        if: github.event.repository.visibility == 'public'
        run: |
          anonymous_docker_config=$(mktemp -d "$RUNNER_TEMP/platform-public-pull.XXXXXX")
          for component in api web protocol-executor postgres; do
            reference="$(cat "image-metadata/$component.repository")@$(cat "image-metadata/$component.digest")"
            if ! DOCKER_CONFIG="$anonymous_docker_config" docker buildx imagetools inspect "$reference" > /dev/null; then
              echo "::error::Release image is not anonymously readable: $reference. An organization package administrator must publish this release package, then rerun the failed release job."
              exit 1
            fi
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes=$RUNNER_TEMP/platform-release-notes.md
          { cat "docs/zh/releases/${GITHUB_REF_NAME}.md"; printf '\n---\n\n'; cat "docs/en/releases/${GITHUB_REF_NAME}.md"; } > "$release_notes"
          gh release create "$GITHUB_REF_NAME" "airalogy-platform-deploy-${GITHUB_REF_NAME}.tar.gz" "airalogy-platform-deploy-${GITHUB_REF_NAME}.tar.gz.sha256" "airalogy-platform-release-${GITHUB_REF_NAME}.json" "airalogy-platform-release-${GITHUB_REF_NAME}.env" compute-runner-package/* instrument-gateway-package/* --title "Airalogy Platform $GITHUB_REF_NAME" --notes-file "$release_notes" --verify-tag
